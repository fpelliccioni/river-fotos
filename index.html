<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Archivo River · Antes y después</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101113;color:#f3f1ec;font:16px system-ui,sans-serif}header{padding:34px max(20px,5vw);border-bottom:1px solid #333;background:linear-gradient(115deg,#261315,#101113 60%)}.eyebrow{color:#ff6d72;letter-spacing:.16em;font-size:12px;font-weight:700}h1{font-size:clamp(28px,5vw,48px);margin:12px 0}p{color:#aaaeb6;line-height:1.5}main{max-width:1400px;margin:auto;padding:24px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}select,button,a.button{font:inherit;color:white;background:#25272d;border:1px solid #454850;border-radius:9px;padding:10px 15px;text-decoration:none;cursor:pointer}button:hover,a.button:hover{background:#3c272c}#count{color:#aaa;margin-left:auto}.card{background:#191b20;border:1px solid #33363e;border-radius:16px;overflow:hidden;margin-bottom:28px}.heading{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;gap:10px}.heading h2{margin:0;font-size:20px}.links{display:flex;gap:12px}.links a{color:#c4c7cf;font-size:13px}.stage{position:relative;background:#070809;aspect-ratio:3/2;overflow:hidden;--split:50%}.stage img{position:absolute;width:100%;height:100%;object-fit:contain;inset:0}.stage .after{clip-path:inset(0 0 0 var(--split))}.divider{position:absolute;left:var(--split);top:0;bottom:0;width:2px;background:white;pointer-events:none;box-shadow:0 0 8px #000}.divider:after{content:'↔';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;color:#111;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:23px}.badge{position:absolute;top:12px;background:#111b;border:1px solid #ffffff40;border-radius:6px;padding:5px 10px;font-size:12px;pointer-events:none}.beforeLabel{left:12px}.afterLabel{right:12px}.drag{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;touch-action:pan-y}.stage:focus-within{outline:2px solid #f15d69;outline-offset:-2px}.foot{padding:12px 20px;color:#aaaeb6;font-size:13px}.side .stage{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:3/1}.side .stage img{position:relative;clip-path:none}.side .divider,.side .drag{display:none}footer{padding:24px;color:#8f949e;text-align:center;font-size:13px}@media(max-width:600px){main{padding:14px}.heading{padding:14px}.links{gap:8px}.side .stage{aspect-ratio:3/1}.toolbar button{padding:10px}.foot{padding:10px 14px}}
</style>
<header><div class="eyebrow">ARCHIVO RIVER</div><h1>La misma historia.<br>Una nueva mirada.</h1><p>Compará cada foto original con su versión retocada. Deslizá sobre la imagen para descubrir el cambio.</p></header>
<main><div class="toolbar"><label>Foto <select id="filter"><option value="all">Todas</option></select></label><button id="mode">Ver lado a lado</button><button id="refresh">Actualizar</button><span id="count"></span></div><div id="gallery" aria-live="polite"></div></main><footer>Los retoques con IA pueden reconstruir detalles que no se distinguían en el original. Las originales se conservan.</footer>
<script>
let photos=[],records={},side=false;const gallery=document.querySelector('#gallery'),filter=document.querySelector('#filter');
function render(){gallery.replaceChildren();let list=photos.filter(n=>filter.value==='all'||filter.value===n);document.querySelector('#count').textContent=list.length+' comparaciones';for(const n of list){let card=document.createElement('article');card.className='card'+(side?' side':'');card.innerHTML=`<div class="heading"><h2>LBDT · ${n}</h2><div class="links"><a href="${records[n].versiones.original.archivo}" target="_blank" rel="noopener">Original ↗</a><a href="${records[n].versiones.restaurada.archivo}?v=${Date.now()}" target="_blank" rel="noopener">Retocada ↗</a></div></div><div class="stage"><img src="${records[n].versiones.original.archivo}" alt="Foto ${n} original" loading="lazy"><img class="after" src="${records[n].versiones.restaurada.archivo}?v=${Date.now()}" alt="Foto ${n} retocada" loading="lazy"><span class="badge beforeLabel">ANTES</span><span class="badge afterLabel">DESPUÉS</span><div class="divider"></div><input class="drag" type="range" min="0" max="100" value="50" aria-label="Comparar antes y después de la foto ${n}"></div><div class="foot">${side?'Original a la izquierda · Retocada a la derecha':'Arrastrá hacia los lados · También podés usar las flechas del teclado'}</div>`;card.querySelector('input').addEventListener('input',e=>card.querySelector('.stage').style.setProperty('--split',e.target.value+'%'));gallery.append(card)}}
async function load(){try{let r=await fetch('catalogo.json',{cache:'no-store'});if(!r.ok)throw Error();const catalog=await r.json();records=Object.fromEntries(catalog.fotos.map(p=>[p.id,p]));photos=catalog.fotos.map(p=>p.id);let previous=filter.value;filter.replaceChildren(new Option('Todas','all'));for(let n of photos)filter.add(new Option(n,n));filter.value=photos.includes(previous)?previous:'all';render()}catch(e){gallery.textContent='No se pudo cargar la galería. Probá actualizar.'}}
filter.onchange=render;document.querySelector('#mode').onclick=e=>{side=!side;e.target.textContent=side?'Ver con deslizador':'Ver lado a lado';render()};document.querySelector('#refresh').onclick=load;load();
</script></html>
